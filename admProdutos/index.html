<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>bolos do jacquin</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:ital,wght@0,100..900;1,100..900&family=Libre+Caslon+Text:ital,wght@0,400;0,700;1,400&display=swap"
        rel="stylesheet">

</head>

<body>
    <header>
        <div class="container header_container">
            <img src="../img/logo.svg" alt="logo bolos do jacquin">

            <div class="box_busca">
                <svg xmlns="http://www.w3.org/2000/svg"
                    viewBox="0 0 640 640"><!--!Font Awesome Free 7.3.1 by @fontawesome - https://fontawesome.com License - https://fontawesome.com/license/free Copyright 2026 Fonticons, Inc.-->
                    <path
                        d="M480 272C480 317.9 465.1 360.3 440 394.7L566.6 521.4C579.1 533.9 579.1 554.2 566.6 566.7C554.1 579.2 533.8 579.2 521.3 566.7L394.7 440C360.3 465.1 317.9 480 272 480C157.1 480 64 386.9 64 272C64 157.1 157.1 64 272 64C386.9 64 480 157.1 480 272zM272 416C351.5 416 416 351.5 416 272C416 192.5 351.5 128 272 128C192.5 128 128 192.5 128 272C128 351.5 192.5 416 272 416z" />
                </svg>
                <input type="text" placeholder="Buscar Douçuras...">
            </div>

            <a class="link_inicio" href="">
                início
                <span>Commencer</span>
                <hr>
            </a>

            <button>
                <svg xmlns="http://www.w3.org/2000/svg"
                    viewBox="0 0 640 640"><!--!Font Awesome Free 7.3.1 by @fontawesome - https://fontawesome.com License - https://fontawesome.com/license/free Copyright 2026 Fonticons, Inc.-->
                    <path
                        d="M96 160C96 142.3 110.3 128 128 128L512 128C529.7 128 544 142.3 544 160C544 177.7 529.7 192 512 192L128 192C110.3 192 96 177.7 96 160zM96 320C96 302.3 110.3 288 128 288L512 288C529.7 288 544 302.3 544 320C544 337.7 529.7 352 512 352L128 352C110.3 352 96 337.7 96 320zM544 480C544 497.7 529.7 512 512 512L128 512C110.3 512 96 497.7 96 480C96 462.3 110.3 448 128 448L512 448C529.7 448 544 462.3 544 480z" />
                </svg>
            </button>
        </div>

    </header>


    <main>
        <h1> Pagina administrativa - bolos do jacquin</h1>
        <section class="cad_produtos">
            <div class="container cad_container">
                <img class="icon_jacquin" src="../img/Logo Bolos do Jacquin.png" alt="">
                <div class="box_h2">
                    <h2>Cadastro de Produtos</h2>
                    <span>Enregistrement du Produit</span>
                    <hr>
                </div>

                <form action="">
                    <div class="inputs_form">
                        <div class="form_coluna1">
                            <div class="linha_form">
                                <label for="nome"></label>
                                <input placeholder="Ex: Opera Éternelle" type="text" name="" id="">
                            </div>

                            <div class="linha_form">
                                <div class="input_cat">
                                    <label for="">categorias</label>
                                    <input type="text" placeholder="Ex: Café, Chocolate, Bolo" name="" id="">
                                </div>
                                <div class="input_img">
                                    <span>imagem</span>
                                    <label for="img">
                                        <svg xmlns="http://www.w3.org/2000/svg"
                                            viewBox="0 0 640 640"><!--! Font Awesome Pro 7.3.1 by @fontawesome - https://fontawesome.com License - https://fontawesome.com/license (Commercial License) Copyright 2026 Fonticons, Inc. -->
                                            <path fill="currentColor"
                                                d="M336 118.6L336 400C336 408.8 328.8 416 320 416C311.2 416 304 408.8 304 400L304 118.6L219.3 203.3C213.1 209.5 202.9 209.5 196.7 203.3C190.5 197.1 190.5 186.9 196.7 180.7L308.7 68.7C314.9 62.5 325.1 62.5 331.3 68.7L443.3 180.7C449.5 186.9 449.5 197.1 443.3 203.3C437.1 209.5 426.9 209.5 420.7 203.3L336 118.6zM256 384L160 384C142.3 384 128 398.3 128 416L128 480C128 497.7 142.3 512 160 512L480 512C497.7 512 512 497.7 512 480L512 416C512 398.3 497.7 384 480 384L384 384L384 352L480 352C515.3 352 544 380.7 544 416L544 480C544 515.3 515.3 544 480 544L160 544C124.7 544 96 515.3 96 480L96 416C96 380.7 124.7 352 160 352L256 352L256 384zM416 448C416 434.7 426.7 424 440 424C453.3 424 464 434.7 464 448C464 461.3 453.3 472 440 472C426.7 472 416 461.3 416 448z" />
                                        </svg>
                                    </label>
                                    <input type="file" name="img" id="">
                                </div>
                            </div>
                            <div class="linha_form">
                                <label for="">descrição curta</label>
                                <textarea
                                    placeholder="Ex: O clássico parisiense: café arábica, chocolate amargo e biscuit joconde."
                                    name="" id="" rows="2"></textarea>
                            </div>
                        </div>

                        <div class="form_coluna2">
                            <div class="linha_form">
                                <div class="input_valor">
                                    <label for="valor por quilo"></label>
                                    <input type="text" name="" id="">
                                </div>
                                <div class="input_ativo">
                                    <label for="">ativo</label>
                                    <input type="checkbox" name="" id="">
                                </div>
                            </div>
                    
                            <div class="linha_form">
                                <label for="descrição longa"></label>
                                <textarea name="" id="" rows="7"></textarea>
                            </div>


                        </div>
                    </div>
                    <input type="button" value="cadastrar">
                </form>
            </div>

        </section>

    </main>

    <footer>

    </footer>

</body>

</html>
